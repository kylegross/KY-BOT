[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ky-bot"
version = "0.1.0"
description = "A modular, slash-command-first Discord bot"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.7,<3", "python-dotenv>=1.1,<2", "aiosqlite>=0.21,<1", "Pillow>=11,<13", "psycopg[binary]>=3.2,<4", "regex>=2024.11", "rlottie-python>=1.3.8,<2", "fonttools>=4.55,<5", "uharfbuzz>=0.42,<1", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
ky-bot = "ky_bot.__main__:main"
ky-bot-migrate = "ky_bot.storage.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ky_bot.confessions" = ["assets/*.png"]
"ky_bot.admin_functions.autoreact" = ["emoji_catalog.json", "UNICODE-LICENSE.txt"]
"ky_bot.design" = ["assets/footer/*.png", "assets/header/*.png", "assets/welcome/*.png", "assets/strips/*.png", "assets/fonts/*.ttf", "assets/fonts/*.txt"]
"ky_bot.checklists" = ["assets/*.png"]
"ky_bot.storage" = ["schema.sql"]
"ky_bot.askdm" = ["assets/*.png"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Preserve the original VICE SQL and privacy-record strings in the port.
"src/ky_bot/admin_functions/autodelete/autodelete_logging.py" = ["E501"]
"src/ky_bot/admin_functions/autodelete/autodelete_store.py" = ["E501"]
