[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ky-bot"
version = "0.1.0"
description = "A modular, slash-command-first Discord bot"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.7,<3", "python-dotenv>=1.1,<2", "aiosqlite>=0.21,<1", "Pillow>=11,<13", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
ky-bot = "ky_bot.__main__:main"
ky-bot-migrate = "ky_bot.storage.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ky_bot.design" = ["assets/footer/*.png", "assets/header/*.png", "assets/welcome/*.png"]
"ky_bot.checklists" = ["assets/*.png"]
"ky_bot.storage" = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
